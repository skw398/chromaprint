name: pkg-config FFT dependency regression

on:
  push:
    branches: [ci/pkgconfig-fft-dependencies]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-link:
    name: ${{ matrix.fft }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {fft: avtx, runner: ubuntu-24.04, cc: gcc, cxx: g++}
          - {fft: avfft, runner: ubuntu-24.04, cc: gcc, cxx: g++}
          - {fft: fftw3, runner: ubuntu-24.04, cc: gcc, cxx: g++}
          - {fft: fftw3f, runner: ubuntu-24.04, cc: gcc, cxx: g++}
          - {fft: kissfft, runner: ubuntu-24.04, cc: gcc, cxx: g++}
          - {fft: vdsp, runner: macos-26, cc: clang, cxx: clang++}
    env:
      FFT_LIB: ${{ matrix.fft }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LC_ALL: C
      XCODE_VERSION: "26.6"
    steps:
      - name: Check out candidate and regression test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: candidate
          persist-credentials: false
      - name: Check out unmodified Chromaprint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: acoustid/chromaprint
          ref: aed8eba2202dd9d7b3b0a56c77904cc805490d72
          path: baseline
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libfftw3-dev
          dpkg-query -W libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libfftw3-dev
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          xcodebuild -version
      - name: Record toolchain
        run: |
          uname -m
          "$CC" --version
          "$CXX" --version
          cmake --version
          pkg-config --version
      - name: Verify installed consumers and existing tests
        run: sh candidate/.github/tests/pkgconfig-fft-dependencies/check.sh
